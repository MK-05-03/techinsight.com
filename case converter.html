<!DOCTYPE html>
<html>
<head>
<title>Case Converter</title>
<style>
body{font-family:sans-serif;background:#0d1117;color:#fff;padding:20px}
textarea{width:100%;height:200px;margin-top:10px;padding:10px}
button{
  padding:10px 15px;
  margin-top:10px;
  margin-right:5px;
  cursor:pointer;
  background:#00c6ff;
  border:none;
  color:#000;
  font-weight:bold;
  border-radius:5px;
}
.box{max-width:800px;margin:auto}
</style>
<link rel="stylesheet" href="style.css">
  <script src="https://pl29276296.profitablecpmratenetwork.com/4d/4c/e7/4d4ce768c7781e47f4805ad78382ed6c.js"></script>

</head>
<header style="margin-top: -35px; margin-bottom: 30px;">
 <a href="index.html" class="logo">
    <img src="favicon.ico" alt="TechInsight Icon" class="logo-icon">
    Tech<span>Insight</span>
</a>

</header>
<body>
<div class="box">
<h2>Case Converter</h2>

<textarea id="text"></textarea><br>

<button onclick="upper()">UPPERCASE</button>
<button onclick="lower()">lowercase</button>
<button onclick="titleCase()">Title Case</button>
<button onclick="copyText()">Copy</button>
<button onclick="clearText()">Clear</button>

</div>

<script>
function upper(){text.value=text.value.toUpperCase();}
function lower(){text.value=text.value.toLowerCase();}
function titleCase(){
text.value=text.value.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
}
function copyText(){
  let textArea = document.getElementById("text");

  textArea.select();
  textArea.setSelectionRange(0, 99999); // mobile support

  document.execCommand("copy");

  alert("Text copied!");
}
function clearText(){
  document.getElementById("text").value = "";
}
</script>

</body>
</html>
