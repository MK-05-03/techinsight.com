<!DOCTYPE html>
<html>
<head>
<title>Spell & Grammar Checker</title>

<style>
body{
  font-family:sans-serif;
  background:#0d1117;
  color:#fff;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

textarea{
  width:100%;
  height:200px;
  padding:10px;
  margin-top:10px;
}

button{
  padding:10px 15px;
  margin-top:10px;
  margin-right:5px;
  cursor:pointer;
  background:#00c6ff;
  border:none;
  color:#000;
  font-weight:bold;
  border-radius:5px;
}

.result{
  margin-top:15px;
  background:#161b22;
  padding:10px;
  border-radius:8px;
}

.error{
  color:#ff4d4d;
}
</style>
<link rel="stylesheet" href="style.css">
  <script src="https://pl29276296.profitablecpmratenetwork.com/4d/4c/e7/4d4ce768c7781e47f4805ad78382ed6c.js"></script>
</head>
<header style="margin-top: -35px; margin-bottom: 30px;">
 <a href="index.html" class="logo">
    <img src="favicon.ico" alt="TechInsight Icon" class="logo-icon">
    Tech<span>Insight</span>
</a>

</header>
<body>

<div class="container">

<h2>Spell & Grammar Checker</h2>

<textarea id="text" placeholder="Type your text here..."></textarea>

<br>

<button onclick="checkText()">Check</button>
<button onclick="copyText()">Copy</button>
<button onclick="clearText()">Clear</button>

<div class="result" id="output">Results will appear here...</div>

</div>

<script>

// SPELL CHECK
async function checkText(){
let text = document.getElementById("text").value;

if(!text){
document.getElementById("output").innerHTML = "Please enter text.";
return;
}

let response = await fetch("https://api.languagetool.org/v2/check", {
method: "POST",
headers: {
"Content-Type": "application/x-www-form-urlencoded"
},
body: new URLSearchParams({
text: text,
language: "en-US"
})
});

let data = await response.json();

if(data.matches.length === 0){
document.getElementById("output").innerHTML = "✅ No mistakes found!";
return;
}

let errors = "";

data.matches.forEach((m, i)=>{
errors += `
<div class="error">
<b>Issue ${i+1}:</b> ${m.message}<br>
<b>Suggestion:</b> ${m.replacements.map(r=>r.value).join(", ")}
</div><hr>
`;
});

document.getElementById("output").innerHTML = errors;
}

// COPY TEXT
function copyText(){
let text = document.getElementById("text");
text.select();
document.execCommand("copy");
alert("Copied to clipboard!");
}

// CLEAR TEXT
function clearText(){
document.getElementById("text").value = "";
document.getElementById("output").innerHTML = "Results cleared.";
}

</script>

</body>
</html>
