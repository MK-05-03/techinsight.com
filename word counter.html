<!DOCTYPE html>
<html>
<head>
<title>Word Counter</title>
<style>
body{font-family:sans-serif;background:#0d1117;color:#fff;padding:20px}
textarea{width:100%;height:200px;margin-top:10px;padding:10px}
.box{max-width:800px;margin:auto}
button{
  padding:10px 15px;
  margin-top:10px;
  margin-right:5px;
  cursor:pointer;
  background:#00c6ff;
  border:none;
  color:#000;
  font-weight:bold;
  border-radius:5px;
}
</style>
<link rel="stylesheet" href="style.css">
</head>
<header style="margin-top: -35px; margin-bottom: 30px;">
 <a href="index.html" class="logo">
    <img src="favicon.ico" alt="TechInsight Icon" class="logo-icon">
    Tech<span>Insight</span>
</a>

</header>
<body>
<div class="box">
<h2>Word & Character Counter</h2>

<textarea id="text" oninput="countText()"></textarea>

<p>Words: <span id="words">0</span></p>
<p>Characters: <span id="chars">0</span></p>
<button onclick="copyText()">Copy</button>
<button onclick="clearText()">Clear</button>
</div>

<script>
function countText(){
let text=document.getElementById("text").value;
let words=text.trim().split(/\s+/).filter(w=>w.length>0);
document.getElementById("words").innerText=words.length;
document.getElementById("chars").innerText=text.length;
}
function copyText(){
  let textArea = document.getElementById("text");

  textArea.select();
  textArea.setSelectionRange(0, 99999); // mobile support

  document.execCommand("copy");

  alert("Text copied!");
}
function clearText(){
  document.getElementById("text").value = "";
}
</script>

</body>
</html>
